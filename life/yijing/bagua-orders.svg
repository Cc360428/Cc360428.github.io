<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">先天与后天八卦方位对照</title><desc id="desc">南在图上。先天乾南坤北离东坎西；后天离南坎北震东兑西。</desc><rect width="100%" height="100%" fill="#f8f5ed"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#263b42"><text x="600" y="44" text-anchor="middle" font-size="30" fill="#263b42">先天与后天八卦方位</text><text x="600" y="80" text-anchor="middle" font-size="21" fill="#263b42">两图均采用南上北下、东左西右；卦画保持正立以便辨认。</text><circle cx="300" cy="330" r="150" fill="none" stroke="#d2c6af" stroke-width="2"/><text x="300" y="330" text-anchor="middle" font-size="24" fill="#263b42">先天（伏羲）</text><rect x="267" y="130" width="66" height="7"/><rect x="267" y="145" width="66" height="7"/><rect x="267" y="160" width="66" height="7"/><text x="300" y="194" text-anchor="middle" font-size="19" fill="#263b42">南 · 乾</text><rect x="137" y="180" width="26.400000000000002" height="7"/><rect x="176.6" y="180" width="26.400000000000002" height="7"/><rect x="137" y="195" width="66" height="7"/><rect x="137" y="210" width="66" height="7"/><text x="170" y="244" text-anchor="middle" font-size="19" fill="#263b42">东南 · 兑</text><rect x="82" y="300" width="66" height="7"/><rect x="82" y="315" width="26.400000000000002" height="7"/><rect x="121.6" y="315" width="26.400000000000002" height="7"/><rect x="82" y="330" width="66" height="7"/><text x="115" y="364" text-anchor="middle" font-size="19" fill="#263b42">东 · 离</text><rect x="137" y="420" width="26.400000000000002" height="7"/><rect x="176.6" y="420" width="26.400000000000002" height="7"/><rect x="137" y="435" width="26.400000000000002" height="7"/><rect x="176.6" y="435" width="26.400000000000002" height="7"/><rect x="137" y="450" width="66" height="7"/><text x="170" y="484" text-anchor="middle" font-size="19" fill="#263b42">东北 · 震</text><rect x="267" y="470" width="26.400000000000002" height="7"/><rect x="306.6" y="470" width="26.400000000