<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc"><title id="title">河图洛书数位图</title><desc id="desc">河图一六北二七南三八东四九西五十中；洛书为四九二三五七八一六。</desc><rect width="100%" height="100%" fill="#f8f5ed"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#263b42"><text x="560" y="45" text-anchor="middle" font-size="30" fill="#263b42">河图与洛书：数位示意</text><text x="560" y="82" text-anchor="middle" font-size="20" fill="#263b42">采用朱熹一系通行的命名；南上北下，东左西右。数字替代传统黑白点。</text><text x="280" y="135" text-anchor="middle" font-size="26" fill="#263b42">河图（1—10 配对）</text><text x="840" y="135" text-anchor="middle" font-size="26" fill="#263b42">洛书（九宫）</text><text x="280" y="220" text-anchor="middle" font-size="24" fill="#263b42">南：2、7</text><text x="100" y="345" text-anchor="middle" font-size="24" fill="#263b42">东：3、8</text><text x="280" y="345" text-anchor="middle" font-size="24" fill="#263b42">中：5、10</text><text x="460" y="345" text-anchor="middle" font-size="24" fill="#263b42">西：4、9</text><text x="280" y="470" text-anchor="middle" font-size="24" fill="#263b42">北：1、6</text><rect x="690" y="180" width="100" height="100" fill="none" stroke="#b7a78d" stroke-width="2"/><text x="740" y="242" text-anchor="middle" font-size="34" fill="#263b42">4</text><rect x="790" y="180" width="100" height="100" fill="none" stroke="#b7a78d" stroke-width="2"/><text x="840" y="242" text-anchor="middle" font-size="34" fill="#263b42">9</text><rect x="890" y="180" width="100" height="100" fill="none" stroke="#b7a78d" stroke-width="2"/><text x="940" y="242" text-anchor="middle" font-size="34" fill="#263b42">2</text><rect x="690" y="280" width="100" height="100" fill="none" stroke="#b7a78d" stroke-width="2"/><text x="740" y="342" text-anchor="middle" font-size="34" fill="#263b42">3</text><rect x="790" y="280" width="100" height="100" fill="none" stroke="#b7a78d" stroke-width="2"/><text x="840" y="342" text-anchor="middle" font-size="34" fill="#263b42">5</text><rect x="890" y="280" width="100" height="100" fill="none" stroke="#b7a78d" stroke-width="2"/><text x="940" y="342" text-anchor="middle" font-size="34" fill="#263b42">7</text><rect x="690" y="380" width="100" height="100" fill="none" stroke="#b7a78d" stroke-width="2"/><text x="740" y="442" text-anchor="middle" font-size="34" fill="#263b42">8</text><rect x="790" y="380" width="100" height="100" fill="none" stroke="#b7a78d" stroke-width="2"/><text x="840" y="442" text-anchor="middle" font-size="34" fill="#263b42">1</text><rect x="890" y="380" width="100" height="100" fill="none" stroke="#b7a78d" stroke-width="2"/><text x="940" y="442" text-anchor="middle" font-size="34" fill="#263b42">6</text><text x="280" y="545" text-anchor="middle" font-size="21" fill="#263b42">五组相差 5，总和 55。</text><text x="840" y="545" text-anchor="middle" font-size="21" fill="#263b42">各行、列与两对角线之和均为 15。</text><text x="560" y="595" text-anchor="middle" font-size="20" fill="#263b42">《系辞》提到“河出图，洛出书”，没有在该句给出这两幅点阵图。</text></g></svg>
