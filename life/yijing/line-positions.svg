<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">既济卦的六爻位置</title><desc id="desc">从底部依次是初九六二九三六四九五上六。下离上坎。</desc><rect width="100%" height="100%" fill="#f8f5ed"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#263b42"><text x="450" y="46" text-anchor="middle" font-size="30" fill="#263b42">怎样读一卦：水火既济</text><text x="450" y="82" text-anchor="middle" font-size="21" fill="#263b42">上卦坎（水）｜下卦离（火）｜六爻由下往上数</text><rect x="320" y="140" width="60" height="17"/><rect x="410" y="140" width="60" height="17"/><rect x="320" y="187" width="150" height="17"/><rect x="320" y="234" width="60" height="17"/><rect x="410" y="234" width="60" height="17"/><rect x="320" y="281" width="150" height="17"/><rect x="320" y="328" width="60" height="17"/><rect x="410" y="328" width="60" height="17"/><rect x="320" y="375" width="150" height="17"/><text x="250" y="155" text-anchor="middle" font-size="24" fill="#263b42">上六</text><text x="615" y="155" text-anchor="middle" font-size="23" fill="#263b42">上卦 · 坎</text><text x="250" y="202" text-anchor="middle" font-size="24" fill="#263b42">九五</text><text x="615" y="202" text-anchor="middle" font-size="23" fill="#263b42">上卦 · 坎</text><text x="250" y="249" text-anchor="middle" font-size="24" fill="#263b42">六四</text><text x="615" y="249" text-anchor="middle" font-size="23" fill="#263b42">上卦 · 坎</text><text x="250" y="296" text-anchor="middle" font-size="24" fill="#263b42">九三</text><text x="615" y="296" text-anchor="middle" font-size="23" fill="#263b42">下卦 · 离</text><text x="250" y="343" text-anchor="middle" font-size="24" fill="#263b42">六二</text><text x="615" y="343" text-anchor="middle" font-size="23" fill="#263b42">下卦 · 离</text><text x="250" y="390" text-anchor="middle" font-size="24" fill="#263b42">初九</text><text x="615" y="390" text-anchor="middle" font-size="23" fill="#263b42">下卦 · 离</text><path d="M110 405 V145 l-9 15 m9 -15 l9 15" fill="none" stroke="#a65c36" stroke-width="4"/><text x="112" y="442" text-anchor="middle" font-size="20" fill="#263b42">起数 ↑</text><text x="450" y="495" text-anchor="middle" font-size="21" fill="#263b42">初、上表示两端；中间用二三四五。阳爻称九，阴爻称六。</text></g></svg>
