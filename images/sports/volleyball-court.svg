<svg xmlns="http://www.w3.org/2000/svg" width="480" height="810" viewBox="0 0 480 810" role="img" aria-labelledby="title desc">
<title id="title">六人排球场与轮转</title><desc id="desc">18米乘9米比例图，两条进攻线距中线3米。下方本队从底线面向网，前排依次4、3、2号位，后排5、6、1号位。接发球方赢回发球权后，2到1到6到5到4到3再到2顺时针轮转。</desc>
<rect width="480" height="810" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, Noto Sans SC, sans-serif" fill="#172a46" text-anchor="middle">
<text x="240" y="36" font-size="24" font-weight="700">排球：位置身份随轮转改变</text><text x="240" y="68" font-size="20">宽 9 m · 长 18 m</text>
<rect x="105" y="90" width="270" height="540" fill="#f2f7fb" stroke="#233f64" stroke-width="2"/>
<rect x="105" y="270" width="270" height="180" fill="#dceef5"/>
<path d="M105 270H375 M105 450H375" stroke="#9c4515" stroke-width="3"/>
<path d="M90 360H390" stroke="#233f64" stroke-width="6"/>
<text x="240" y="229" font-size="22">对方后区</text><text x="240" y="315" font-size="22">对方前区</text>
<text x="240" y="395" font-size="20">本方前排</text>
<g font-size="25" font-weight="700"><text x="150" y="432">4</text><text x="240" y="432">3</text><text x="330" y="432">2</text><text x="150" y="551">5</text><text x="240" y="551">6</text><text x="330" y="551">1</text></g>
<text x="240" y="593" font-size="20">本方后排</text><text x="240" y="667" font-size="20">棕线：进攻线，距中线 3 m</text><text x="240" y="700" font-size="22">轮转：2 → 1 → 6 → 5 → 4 → 3 → 2</text><text x="240" y="734" font-size="20">接发球队赢回发球权时才轮转</text><text x="240" y="782" font-size="18">场地按比例 · 数字是位置，不是球衣号码</text>
</g></svg>
